name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: 12.4.2
          runtime: node@24.21.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Build and enforce release policies
        run: |
          pnpm build
          pnpm check:performance
          pnpm check:security-policy
          pnpm check:release-docs
          pnpm check:app-icons

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: 12.4.2
          runtime: node@24.21.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm check:security

      - name: Capture production license inventory
        run: pnpm inventory:licenses > dependency-licenses.json

      - name: Upload dependency license inventory
        uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses
          path: dependency-licenses.json
          if-no-files-found: error
          retention-days: 14

  chromium-regression:
    name: Chromium regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: 12.4.2
          runtime: node@24.21.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Run full Chromium regression suite
        run: pnpm test:browser

  compatibility:
    name: Compatibility ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: 12.4.2
          runtime: node@24.21.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Build
        run: pnpm build

      - name: Run Stage 11 compatibility suite
        run: pnpm test:compatibility --project=${{ matrix.browser }}

  static-fallback:
    name: Static fallback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: 12.4.2
          runtime: node@24.21.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and inspect repository-path fallback
        run: |
          pnpm build:static-fallback
          pnpm check:static-fallback

      - name: Run fallback browser acceptance
        run: pnpm test:static-fallback

  release-evidence:
    name: Stage 12 release evidence
    if: github.event_name == 'pull_request' && github.head_ref == 'stage-12-deploy-public-release'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact release head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: 12.4.2
          runtime: node@24.21.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build exact release head
        run: pnpm build

      - name: Capture release evidence
        env:
          HAWYA_RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm test:release-evidence

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage12-release-evidence-${{ github.event.pull_request.head.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
