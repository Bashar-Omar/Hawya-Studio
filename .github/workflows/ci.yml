name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: 12.4.2
          runtime: node@24.21.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Build and enforce release policies
        run: |
          pnpm build
          pnpm check:performance
          pnpm check:security-policy

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: 12.4.2
          runtime: node@24.21.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm check:security

      - name: Capture production license inventory
        run: pnpm inventory:licenses > dependency-licenses.json

      - name: Upload dependency license inventory
        uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses
          path: dependency-licenses.json
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Browser ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: 12.4.2
          runtime: node@24.21.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Build
        run: pnpm build

      - name: Run browser suite
        run: pnpm exec playwright test --project=${{ matrix.browser }}
