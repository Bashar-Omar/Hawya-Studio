name: Materialize Stage 01

on:
  pull_request:
    branches: [main]
    paths:
      - ".stage01/**"

permissions:
  contents: write

concurrency:
  group: stage-01-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Stage 01 branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Reassemble verified Stage 01 delta
        shell: bash
        run: |
          set -euo pipefail
          cat .stage01/chunk-*.b64 | tr -d '\n' | base64 --decode > /tmp/stage01-changes.zip
          echo "f334f5bd45819fbea27402c7cd6845759e56aa70e93585b1c432977e149f0320  /tmp/stage01-changes.zip" | sha256sum --check
          unzip -t /tmp/stage01-changes.zip
          unzip -oq /tmp/stage01-changes.zip -d .
          rm -rf .stage01

      - name: Apply verified accessibility and motion fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected Stage 01 patch target not found: {path}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/components/app/CommandMenu.tsx",
              '<div className="command-list" role="group" aria-label={t("command.menu.title")}>',
              '<fieldset className="command-list">\n            <legend className="sr-only">{t("command.menu.title")}</legend>',
          )
          replace_once(
              "src/components/app/CommandMenu.tsx",
              '          </div>\n        </DialogContent>',
              '          </fieldset>\n        </DialogContent>',
          )

          replace_once(
              "src/components/app/ShortcutDialog.tsx",
              '''              <span className="shortcut-keys" aria-label={shortcut.keys.join(" + ")}>
                {shortcut.keys.map((key) => (
                  <kbd key={key}>{key}</kbd>
                ))}
              </span>''',
              '''              <span className="shortcut-keys">
                <span className="sr-only">{shortcut.keys.join(" + ")}</span>
                <span aria-hidden="true">
                  {shortcut.keys.map((key) => (
                    <kbd key={key}>{key}</kbd>
                  ))}
                </span>
              </span>''',
          )

          replace_once(
              "src/components/ui/segmented-control.tsx",
              '''    <div className={joinClassNames("segmented-control", className)} role="group" aria-label={ariaLabel}>
      {options.map((option) => (''',
              '''    <fieldset className={joinClassNames("segmented-control", className)}>
      <legend className="sr-only">{ariaLabel}</legend>
      {options.map((option) => (''',
          )
          replace_once(
              "src/components/ui/segmented-control.tsx",
              '''      ))}
    </div>
  );''',
              '''      ))}
    </fieldset>
  );''',
          )

          replace_once(
              "src/features/landing/LandingPage.tsx",
              '''          <div className="landing-system-card" aria-label={t("landing.system.aria")}>
            <div className="system-card__label">''',
              '''          <figure className="landing-system-card" aria-labelledby="landing-system-caption">
            <figcaption className="sr-only" id="landing-system-caption">
              {t("landing.system.aria")}
            </figcaption>
            <div className="system-card__label">''',
          )
          replace_once(
              "src/features/landing/LandingPage.tsx",
              '''            </div>
          </div>
        </section>''',
              '''            </div>
          </figure>
        </section>''',
          )

          replace_once(
              "src/features/project-library/StudioHomePage.tsx",
              '''          <div className="empty-project-state__actions" aria-label={t("studio.projects.title")}>
            <Button''',
              '''          <fieldset className="empty-project-state__actions">
            <legend className="sr-only">{t("studio.projects.title")}</legend>
            <Button''',
          )
          replace_once(
              "src/features/project-library/StudioHomePage.tsx",
              '''            </Button>
          </div>
        </section>''',
              '''            </Button>
          </fieldset>
        </section>''',
          )

          css = Path("src/styles/globals.css")
          text = css.read_text()
          text = text.replace(
              'html[dir="rtl"] .landing-hero__copy h1 {',
              ':where(html[dir="rtl"]) .landing-hero__copy h1 {',
              1,
          )
          text = text.replace(
              ".segmented-control {\n",
              ".segmented-control {\n  min-inline-size: 0;\n  margin: 0;\n",
              1,
          )
          text = text.replace(
              ".command-list {\n",
              ".command-list {\n  min-inline-size: 0;\n  margin: 0;\n  border: 0;\n",
              1,
          )
          text = text.replace(
              ".empty-project-state__actions {\n",
              ".empty-project-state__actions {\n  min-inline-size: 0;\n  margin: 0;\n  border: 0;\n  padding: 0;\n",
              1,
          )
          old_motion = '''@media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
              scroll-behavior: auto !important;
              animation-duration: 0.01ms !important;
              animation-iteration-count: 1 !important;
              transition-duration: 0.01ms !important;
            }
          }'''
          new_motion = '''@media (prefers-reduced-motion: reduce) {
            html {
              scroll-behavior: auto;
            }

            .skip-link,
            .button-base,
            .link-button,
            .toolbar-action,
            .navigation-rail__item,
            .segmented-control__item,
            .command-item,
            .repository-link {
              transition: none;
            }

            .dialog-backdrop,
            .dialog-popup {
              animation: none;
            }
          }'''
          if old_motion not in text:
              raise SystemExit("Expected reduced-motion block not found")
          css.write_text(text.replace(old_motion, new_motion, 1))
          PY

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: 12.4.2
          runtime: node@24.21.0
          cache: false
          install: false

      - name: Generate deterministic lockfile
        run: pnpm install --lockfile-only

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Canonicalize source
        run: pnpm format

      - name: Stage 01 compile and unit gate
        run: |
          pnpm check
          pnpm build

      - name: Commit materialized Stage 01
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: materialize Stage 01 app shell and RTL foundation"
          git push origin HEAD:${{ github.head_ref }}
