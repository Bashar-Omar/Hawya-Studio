name: Materialize Stage 02

on:
  pull_request:
    branches: [main]
    paths:
      - ".stage02/**"

permissions:
  contents: write

concurrency:
  group: stage-02-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Stage 02 branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Reassemble verified Stage 02 delta
        shell: bash
        run: |
          set -euo pipefail
          cat .stage02/chunk-*.b64 | tr -d '\n' | base64 --decode > /tmp/stage02-delta.zip
          echo "5f8d60d8f880793fe52b6b1fb19a961e77d456fc1f7dbd8ebbd66c48d0c3fe5e  /tmp/stage02-delta.zip" | sha256sum --check
          unzip -t /tmp/stage02-delta.zip
          unzip -oq /tmp/stage02-delta.zip -d .
          rm -rf .stage02
          test -f src/domain/project/hawya-project.ts
          test -f src/infrastructure/db/hawya-database.ts
          test -f src/infrastructure/archive/fflate-project-archive-codec.ts
          test -f src/infrastructure/db/stage02-roundtrip.test.ts

      - name: Apply Stage 02 lint and type hygiene fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected Stage 02 patch target not found: {path}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/application/use-cases/delete-project.ts",
              'import { GarbageCollectBinariesUseCase } from "@/application/use-cases/garbage-collect-binaries";',
              'import type { GarbageCollectBinariesUseCase } from "@/application/use-cases/garbage-collect-binaries";',
          )
          replace_once(
              "src/infrastructure/db/dexie-project-repository.ts",
              'import { type GuidePage, type PageId } from "@/domain/guide/guide-document";',
              'import type { GuidePage, PageId } from "@/domain/guide/guide-document";',
          )
          replace_once(
              "src/infrastructure/archive/fflate-project-archive-codec.ts",
              'import { projectSnapshotSchema } from "@/domain/project/hawya-project";',
              'import { projectSnapshotSchema, type ProjectSnapshot } from "@/domain/project/hawya-project";',
          )
          replace_once(
              "src/infrastructure/archive/fflate-project-archive-codec.ts",
              "      let snapshot;",
              "      let snapshot: ProjectSnapshot;",
          )
          replace_once(
              "src/application/use-cases/delete-project.test.ts",
              'import { createSyntheticProjectFixture } from "../../../tests/fixtures/stage02/synthetic-project";',
              'import { SYNTHETIC_IMPORT_ID, createSyntheticProjectFixture } from "../../../tests/fixtures/stage02/synthetic-project";',
          )
          replace_once(
              "src/application/use-cases/delete-project.test.ts",
              "        id: fixture.importProjectId,",
              "        id: SYNTHETIC_IMPORT_ID,",
          )
          replace_once(
              "src/application/use-cases/delete-project.test.ts",
              "        projectId: fixture.importProjectId,",
              "        projectId: SYNTHETIC_IMPORT_ID,",
          )
          replace_once(
              "src/domain/project/errors.ts",
              "  readonly cause?: unknown;",
              "  override readonly cause?: unknown;",
          )
          replace_once(
              "src/domain/project/errors.ts",
              "  readonly cause?: unknown;",
              "  override readonly cause?: unknown;",
          )
          replace_once(
              "src/infrastructure/runtime/web-crypto-sha256-hasher.ts",
              "    const input = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);",
              "    const input = Uint8Array.from(bytes);",
          )
          PY

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: 12.4.2
          runtime: node@24.21.0
          cache: false
          install: false

      - name: Generate deterministic lockfile
        run: pnpm install --lockfile-only

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Canonicalize source
        run: pnpm format

      - name: Stage 02 strict gate
        run: |
          pnpm check
          pnpm build

      - name: Commit materialized Stage 02
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: materialize Stage 02 domain persistence and archive"
          git push origin HEAD:${{ github.head_ref }}
