name: Materialize Stage 02

on:
  pull_request:
    branches: [main]
    paths:
      - ".stage02/**"

permissions:
  contents: write

concurrency:
  group: stage-02-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Stage 02 branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Reassemble verified Stage 02 delta
        shell: bash
        run: |
          set -euo pipefail
          cat .stage02/chunk-*.b64 | tr -d '\n' | base64 --decode > /tmp/stage02-delta.zip
          echo "5f8d60d8f880793fe52b6b1fb19a961e77d456fc1f7dbd8ebbd66c48d0c3fe5e  /tmp/stage02-delta.zip" | sha256sum --check
          unzip -t /tmp/stage02-delta.zip
          unzip -oq /tmp/stage02-delta.zip -d .
          rm -rf .stage02
          test -f src/domain/project/hawya-project.ts
          test -f src/infrastructure/db/hawya-database.ts
          test -f src/infrastructure/archive/fflate-project-archive-codec.ts
          test -f src/infrastructure/db/stage02-roundtrip.test.ts

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: 12.4.2
          runtime: node@24.21.0
          cache: false
          install: false

      - name: Generate deterministic lockfile
        run: pnpm install --lockfile-only

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Canonicalize source
        run: pnpm format

      - name: Stage 02 strict gate
        run: |
          pnpm check
          pnpm build

      - name: Commit materialized Stage 02
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: materialize Stage 02 domain persistence and archive"
          git push origin HEAD:${{ github.head_ref }}
