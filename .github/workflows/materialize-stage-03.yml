name: Materialize Stage 03

on:
  pull_request:
    branches: [main]
    paths:
      - ".stage03/**"

permissions:
  contents: write

concurrency:
  group: stage-03-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Stage 03 branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Reassemble verified Stage 03 delta
        shell: bash
        run: |
          set -euo pipefail
          cat .stage03/chunk-*.b64 | tr -d '\n' | base64 --decode > /tmp/stage03-delta.tar.xz
          echo "c9c86d0fdeda3afcb0b5abf96cb65c3a2c18902ba6e6a98a9d295cf931943eab  /tmp/stage03-delta.tar.xz" | sha256sum --check
          xz --test /tmp/stage03-delta.tar.xz
          tar -tJf /tmp/stage03-delta.tar.xz
          tar -xJf /tmp/stage03-delta.tar.xz -C .
          rm -rf .stage03
          test -f src/features/project-library/StudioHomePage.tsx
          test -f src/features/new-project/NewProjectPage.tsx
          test -f src/infrastructure/db/stage03-project-lifecycle.test.ts
          test -f tests/e2e/stage03-project-library.spec.ts

      - name: Apply Stage 03 accessibility and CSS hygiene fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected Stage 03 patch target not found: {path}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/features/new-project/NewProjectPage.tsx",
              "            autoFocus\n",
              "",
          )
          replace_once(
              "src/features/new-project/NewProjectPage.tsx",
              '        <div className="setup-summary" aria-label={t("wizard.summary")}> \n          {SETUP_STEPS.filter((step) => step !== "basic" && step !== "guide").map((step) => (\n            <div key={step} className="setup-summary__row"><span>{t(stepLabelKeys[step])}</span><strong>{draft.steps[step] === "skipped" ? t("wizard.status.missing") : t("wizard.status.ready")}</strong></div>\n          ))}\n        </div>',
              '        <section className="setup-summary" aria-labelledby="setup-summary-title">\n          <h2 className="sr-only" id="setup-summary-title">{t("wizard.summary")}</h2>\n          {SETUP_STEPS.filter((step) => step !== "basic" && step !== "guide").map((step) => (\n            <div key={step} className="setup-summary__row"><span>{t(stepLabelKeys[step])}</span><strong>{draft.steps[step] === "skipped" ? t("wizard.status.missing") : t("wizard.status.ready")}</strong></div>\n          ))}\n        </section>',
          )
          replace_once(
              "src/features/project-library/StudioHomePage.tsx",
              '      <div className="project-card__actions" aria-label={t("studio.project.actions", { name: item.metadata.name })}>',
              '      <fieldset className="project-card__actions">\n        <legend className="sr-only">{t("studio.project.actions", { name: item.metadata.name })}</legend>',
          )
          replace_once(
              "src/features/project-library/StudioHomePage.tsx",
              '      </div>\n\n      {error ? <p className="inline-error" role="alert">{error}</p> : null}',
              '      </fieldset>\n\n      {error ? <p className="inline-error" role="alert">{error}</p> : null}',
          )

          css = Path("src/styles/globals.css")
          text = css.read_text()
          text = text.replace(
              'html[dir="rtl"] .page-heading h1,\nhtml[dir="rtl"] .not-found-page h1 {',
              ':where(html[dir="rtl"]) .page-heading h1,\n:where(html[dir="rtl"]) .not-found-page h1 {',
              1,
          )
          icon_block = '''.wizard-progress__icon {
            display: grid;
            width: 28px;
            height: 28px;
            flex: 0 0 auto;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface-1);
          }

          '''
          completed_marker = '.wizard-progress__item.is-completed .wizard-progress__icon {'
          if icon_block not in text or completed_marker not in text:
              raise SystemExit("Expected wizard progress CSS blocks not found")
          text = text.replace(icon_block, "", 1)
          text = text.replace(completed_marker, icon_block + completed_marker, 1)
          text = text.replace(
              '.project-card__actions {\n  border-block-start: 1px solid var(--border);\n  padding: 8px 10px;\n}',
              '.project-card__actions {\n  min-inline-size: 0;\n  margin: 0;\n  border: 0;\n  border-block-start: 1px solid var(--border);\n  padding: 8px 10px;\n}',
              1,
          )
          replace_once(
              "src/app/commands/command-registry.ts",
              'export type AppCommandId =\n  | "navigate.landing"',
              'export type AppCommandId =\n  | "project.create"\n  | "navigate.landing"',
          )
          replace_once(
              "src/features/new-project/NewProjectPage.tsx",
              "function WizardProgress({ draft }: { draft?: ProjectSetupDraft }) {",
              "function WizardProgress({ draft }: { draft: ProjectSetupDraft | undefined }) {",
          )
          replace_once(
              "src/features/new-project/NewProjectPage.tsx",
              "  draft?: ProjectSetupDraft;\n  title: string;",
              "  draft: ProjectSetupDraft | undefined;\n  title: string;",
          )
          css.write_text(text)
          PY

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: 12.4.2
          runtime: node@24.21.0
          cache: false
          install: false

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Canonicalize source
        run: pnpm format

      - name: Stage 03 strict gate
        run: |
          pnpm check
          pnpm build

      - name: Commit materialized Stage 03
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: materialize Stage 03 project library and setup wizard"
          git push origin HEAD:${{ github.head_ref }}
