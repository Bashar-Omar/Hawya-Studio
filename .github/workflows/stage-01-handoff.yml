name: Stage 01 Handoff

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/stage-01-handoff.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Stage 01 snapshot
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Prepare clean handoff tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/Hawya-Studio
          rsync -a --delete \
            --exclude ".git/" \
            --exclude ".github/workflows/stage-01-handoff.yml" \
            --exclude "node_modules/" \
            --exclude "dist/" \
            --exclude "coverage/" \
            --exclude "playwright-report/" \
            --exclude "test-results/" \
            --exclude ".vercel/" \
            --exclude "*.tsbuildinfo" \
            ./ /tmp/Hawya-Studio/
          test -f /tmp/Hawya-Studio/package.json
          test -f /tmp/Hawya-Studio/pnpm-lock.yaml
          test -f /tmp/Hawya-Studio/docs/stages/STAGE-01-COMPLETION.md
          test -f /tmp/Hawya-Studio/src/components/app/AppShell.tsx
          test -f /tmp/Hawya-Studio/tests/e2e/stage01-shell.spec.ts

      - name: Upload clean Stage 01 tree
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Hawya-Studio-Stage-01-Complete
          path: /tmp/Hawya-Studio
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
