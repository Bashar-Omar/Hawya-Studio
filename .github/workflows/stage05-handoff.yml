name: Stage 05 Handoff Snapshot

on:
  push:
    branches:
      - handoff-stage-05-snapshot

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout handoff branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Build exact merged-main archive
        shell: bash
        run: |
          set -euo pipefail
          MERGE_SHA="38452276b0698ab45439bccdc6469eb496a93894"
          git cat-file -e "${MERGE_SHA}^{commit}"
          git archive --format=zip --output=/tmp/Hawya-Studio-Stage-05-Complete.zip "${MERGE_SHA}"
          unzip -t /tmp/Hawya-Studio-Stage-05-Complete.zip
          sha256sum /tmp/Hawya-Studio-Stage-05-Complete.zip > /tmp/Hawya-Studio-Stage-05-Complete.sha256
          mkdir -p handoff
          cp /tmp/Hawya-Studio-Stage-05-Complete.zip handoff/
          cp /tmp/Hawya-Studio-Stage-05-Complete.sha256 handoff/
          cat handoff/Hawya-Studio-Stage-05-Complete.sha256

      - name: Upload exact merged-main handoff
        uses: actions/upload-artifact@v4.6.2
        with:
          name: hawya-stage-05-handoff
          path: handoff/
          if-no-files-found: error
          retention-days: 1
