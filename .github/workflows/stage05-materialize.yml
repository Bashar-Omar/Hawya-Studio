name: Stage 05 Source Materializer

on:
  push:
    branches:
      - stage-05-guide-generator-templates

permissions:
  contents: write

concurrency:
  group: stage05-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Stage 05 branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: stage-05-guide-generator-templates

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: 12.4.2
          runtime: node@24.21.0
          cache: true
          install: false

      - name: Verify and materialize source delta
        shell: bash
        run: |
          set -euo pipefail
          cat .stage05/chunk-* | base64 --decode > /tmp/stage05-delta.zip
          echo "6d0f5cc5586767ef7d96b9e079d149d0d288ab9c07e437faf754e0f1aa2a8e84  /tmp/stage05-delta.zip" | sha256sum --check -
          unzip -t /tmp/stage05-delta.zip
          unzip -o /tmp/stage05-delta.zip -d .
          rm -rf .stage05
          rm -f .github/workflows/stage05-materialize.yml

      - name: Validate lockfile and format source
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm format

      - name: Commit materialized Stage 05 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement Stage 05 guide generator and templates"
          git push origin HEAD:stage-05-guide-generator-templates
