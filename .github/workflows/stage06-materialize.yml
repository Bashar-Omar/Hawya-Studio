name: Stage 06 Materialize Source

on:
  push:
    branches:
      - stage-06-advanced-editor-core
    paths:
      - ".github/workflows/stage06-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v7.0.1
        with:
          ref: stage-06-advanced-editor-core
          fetch-depth: 0

      - name: Reconstruct and verify Stage 06 source
        shell: bash
        run: |
          set -euo pipefail
          cat .stage06/s6z-* > /tmp/stage06.b64
          base64 --decode /tmp/stage06.b64 > /tmp/stage06.tar.zst
          echo "e441ef631f3d77dfd6ba1eb6b5c52ef483b19964312b74feda3067b4a19fd7f6  /tmp/stage06.tar.zst" | sha256sum -c -
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi
          zstd -d -q -f /tmp/stage06.tar.zst -o /tmp/stage06.tar
          echo "d275cf807c74f6ceb7a36d59dcfe623ed16b20e2b60699771547e127e864f7d0  /tmp/stage06.tar" | sha256sum -c -
          mkdir -p /tmp/stage06-src
          tar -tf /tmp/stage06.tar | while IFS= read -r entry; do
            case "$entry" in
              /*|*"../"*|../*) echo "Unsafe tar entry: $entry" >&2; exit 1 ;;
            esac
          done
          tar -xf /tmp/stage06.tar -C /tmp/stage06-src
          rsync -a /tmp/stage06-src/ ./
          rm -rf .stage06
          rm -f .github/workflows/stage06-bootstrap.yml
          rm -f .github/workflows/stage06-materialize.yml

      - name: Set up pnpm and Node.js
        uses: pnpm/action-setup@v5
        with:
          version: 12.4.2
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Canonicalize dependency lock and formatting
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm format

      - name: Commit materialized Stage 06 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: materialize Stage 06 advanced editor core"
          git push origin HEAD:stage-06-advanced-editor-core

      - name: Preliminary strict gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm check
          pnpm build
