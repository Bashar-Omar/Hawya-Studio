name: Stage 07 Materialize

on:
  push:
    branches:
      - stage-07-smart-engines-audit
    paths:
      - ".stage07/**"
      - ".github/workflows/stage07-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          version: 12.4.2
          runtime: node@24.21.0
          cache: true
          install: false

      - name: Verify and materialize source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .stage07/payload.b64 > /tmp/stage07-source.tar.zst
          echo "778be0852a640d35a3a5a3e1650691ecc39a59e53aa3029de264daa4a8a64874  /tmp/stage07-source.tar.zst" | sha256sum -c -
          zstd -q -d -f /tmp/stage07-source.tar.zst -o /tmp/stage07-source.tar
          echo "8d5b633b63f4e0be4dee55f5b641f18b00a93f33d3cea7e53653dde3ad3a67a1  /tmp/stage07-source.tar" | sha256sum -c -
          python - <<'PY'
          import tarfile
          from pathlib import PurePosixPath
          with tarfile.open("/tmp/stage07-source.tar", "r:") as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit("Stage 07 payload is empty")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe tar member: {member.name}")
                  if not member.isfile():
                      raise SystemExit(f"Unexpected non-file tar member: {member.name}")
              with open("/tmp/stage07-members.txt", "w", encoding="utf-8") as handle:
                  for member in members:
                      handle.write(member.name + "\n")
              print(f"Verified {len(members)} safe Stage 07 source files")
          PY
          tar -xf /tmp/stage07-source.tar -C .

      - name: Apply reviewed Stage 07 lint fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          def regex_replace(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              content = file.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, content, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"Expected exactly one patch match in {path}; got {count}")
              file.write_text(updated, encoding="utf-8")

          regex_replace(
              "src/application/use-cases/apply-audit-quick-fix.ts",
              r'if\s*\(\s*!layer\s*\|\|\s*layer\.type\s*!==\s*"text"\s*\)\s*throw new Error\("Audit quick-fix text layer does not exist"\);',
              'if (layer?.type !== "text")\n  throw new Error("Audit quick-fix text layer does not exist");',
          )
          regex_replace(
              "src/domain/audit/audit-engine.ts",
              r'if\s*\(\s*!asset\s*\|\|\s*asset\.kind\s*!==\s*"font"\s*\)\s*\{',
              'if (asset?.kind !== "font") {',
          )
          panel = Path("src/features/brand-system/AuditPanel.tsx")
          panel_content = panel.read_text(encoding="utf-8")
          group_pattern = re.compile(
              r'<div\s+className="audit-counts"\s+aria-label=\{t\("audit\.report\.summary"\)\}>(.*?)</div>',
              flags=re.MULTILINE | re.DOTALL,
          )
          match = group_pattern.search(panel_content)
          if match is None:
              raise SystemExit("Expected audit counts group missing")
          items = match.group(1).replace("<span ", "<li ").replace("</span>", "</li>")
          replacement = '<ul className="audit-counts" aria-label={t("audit.report.summary")}>' + items + "</ul>"
          panel_content = panel_content[:match.start()] + replacement + panel_content[match.end():]
          panel.write_text(panel_content, encoding="utf-8")

          css = Path("src/features/brand-system/brand-system.css")
          content = css.read_text(encoding="utf-8")
          count_pattern = re.compile(
              r'\.audit-counts\s+span\s*\{[^}]*\}',
              flags=re.MULTILINE,
          )
          rule_pattern = re.compile(
              r'\.audit-rule-card\s+header\s+span\s*\{[^}]*\}',
              flags=re.MULTILINE,
          )
          count_match = count_pattern.search(content)
          rule_match = rule_pattern.search(content)
          if count_match is None or rule_match is None:
              raise SystemExit("Expected CSS specificity patch anchors missing")
          count_block = count_match.group(0).replace(".audit-counts span", ".audit-counts li")
          content = content[:count_match.start()] + content[count_match.end():]
          rule_match = rule_pattern.search(content)
          if rule_match is None:
              raise SystemExit("Rule span block disappeared during CSS patch")
          content = content[:rule_match.start()] + count_block + "\n" + content[rule_match.start():]
          css.write_text(content, encoding="utf-8")
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical formatting
        run: pnpm format

      - name: Package formatted source diagnostic
        shell: bash
        run: |
          set -euo pipefail
          zip -q /tmp/stage07-formatted-source.zip -@ < /tmp/stage07-members.txt
          sha256sum /tmp/stage07-formatted-source.zip

      - name: Quality gate before commit
        run: pnpm check

      - name: Upload formatted source diagnostic
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: stage07-formatted-source-diagnostic
          path: /tmp/stage07-formatted-source.zip
          if-no-files-found: error
          retention-days: 1

      - name: Production build before commit
        run: pnpm build

      - name: Commit verified Stage 07 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .stage07
          rm -f .github/workflows/stage07-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized changes to commit"
            exit 1
          fi
          git commit -m "feat: implement Stage 07 smart engines and audit"
          git push origin HEAD:stage-07-smart-engines-audit
