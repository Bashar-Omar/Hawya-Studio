name: Stage 08 format hardening

on:
  push:
    branches: [stage-08-exports]
    paths: [".github/workflows/stage08-format-hardening.yml"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage-08-exports
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Stage 08 hardening
        run: |
          pnpm exec biome format --write             src/domain/export/raster-dimensions.ts             src/domain/export/raster-dimensions.test.ts             src/application/ports/scene-rasterizer.ts             src/infrastructure/workers/export-worker-protocol.ts             src/workers/export-raster.worker.ts             src/infrastructure/export/raster-export-renderer.ts             src/infrastructure/export/svg-export-renderer.ts             src/infrastructure/export/stage08-svg-renderer.test.ts             src/infrastructure/export/create-export-feature-runtime.ts             src/infrastructure/export/brand-artifact-builders.ts             src/infrastructure/export/package-export-renderers.ts             src/infrastructure/export/stage08-package-renderers.test.ts             src/features/export/ExportCenterPage.tsx             src/features/export/export.css             src/i18n/messages/en.ts             src/i18n/messages/ar.ts
          rm .github/workflows/stage08-format-hardening.yml
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: format Stage 08 export hardening"
          git push origin HEAD:stage-08-exports
