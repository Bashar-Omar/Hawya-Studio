name: Stage 08 format slice 4

on:
  push:
    branches: [stage-08-exports]
    paths: [".github/workflows/stage08-format-slice4.yml"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage-08-exports
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Stage 08 export execution and UI
        run: |
          pnpm exec biome format --write             src/infrastructure/export/raster-export-renderer.ts             src/infrastructure/export/project-archive-export-renderer.ts             src/infrastructure/file-system/browser-artifact-files.ts             src/infrastructure/export/create-export-feature-runtime.ts             src/features/export/ExportCenterPage.tsx             src/features/export/PrintViewPage.tsx             src/features/export/export.css             src/app/routes/route-config.ts             src/app/routes/route-config.test.ts             src/app/App.tsx             src/features/guide-studio/GuideStudioPage.tsx             src/i18n/messages/en.ts             src/i18n/messages/ar.ts
          rm .github/workflows/stage08-format-slice4.yml
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: format Stage 08 export UI slice"
          git push origin HEAD:stage-08-exports
